server:
  port: ${SERVER_PORT:9000}  # dev 9000, 배포에서는 SERVER_PORT=8080 주입

spring:
  application:
    name: fhk-security-server

  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL:jdbc:mariadb://192.168.45.210:3306/fhk_secu_db}
    username: ${DB_USER}
    password: ${DB_PW}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        default_batch_fetch_size: 1000
        format_sql: true
        show_sql: true

  data:
    redis:
      host: ${REDIS_HOST:192.168.45.211}  # 사설 IP 고정
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PW}

fhk:
  security:
    whitelist:
      - OPTIONS:/**
      - /actuator/health
      - /actuator/health/**
      - /actuator/info
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - POST:/auth/login
      - POST:/auth/refresh
      - POST:/accounts
      - GET:/accounts/availability

  jwt:
    issuer: # 발급 서버에서 사용
      private-key-path: classpath:keys/jwt-private.pem
      access-expire-ms: 900000       # 15분
      refresh-expire-ms: 1209600000   # 14일

    verifier: # JWT 인증시 사용
      public-key-path: classpath:keys/jwt-public.pem


management: # actuator pod 헬스체크
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      
logging:
  level:
    com.fhk: DEBUG
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
